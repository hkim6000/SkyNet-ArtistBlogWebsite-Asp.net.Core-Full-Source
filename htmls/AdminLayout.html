<div class="ay-site ay-admin" id="ay-site" data-theme="light" style="{plhd_style}">
<header class="ay-ahead">

    <a class="ay-abrand" href="Admin"><b>Studio</b> admin</a>
    <span class="ay-demo" id="ay-demo"></span>
    <a class="ay-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ay-out" onclick="AdminLayoutJs.signOut()">Sign out</button>

<aside class="ay-side" id="ay-nav" aria-label="Admin">
    <div class="ay-nav-top"><span>Admin</span><button type="button" class="ay-ibtn" aria-label="Close" onclick="AdminLayoutJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ay-amenu"><li><a class="ay-al" href="Admin">Dashboard<i class="ay-cnt" id="ay-cnt-Admin"></i></a></li><li><a class="ay-al ay-on" href="AdminLayout">Pages<i class="ay-cnt" id="ay-cnt-AdminLayout"></i></a></li><li><a class="ay-al" href="AdminPosts">Journal<i class="ay-cnt" id="ay-cnt-AdminPosts"></i></a></li><li><a class="ay-al" href="AdminWorks">Works<i class="ay-cnt" id="ay-cnt-AdminWorks"></i></a></li><li><a class="ay-al" href="AdminComments">Comments<i class="ay-cnt" id="ay-cnt-AdminComments"></i></a></li><li><a class="ay-al" href="AdminMessages">Messages<i class="ay-cnt" id="ay-cnt-AdminMessages"></i></a></li><li><a class="ay-al" href="AdminSettings">Settings<i class="ay-cnt" id="ay-cnt-AdminSettings"></i></a></li></ul>
</aside>
<div class="ay-scrim" id="ay-scrim" onclick="AdminLayoutJs.closeNav()"></div>
<div class="ay-toast" id="ay-toast" role="status" aria-live="polite"></div>

</div>
