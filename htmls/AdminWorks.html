<div class="aw-site aw-admin" id="aw-site" data-theme="light" style="{plhd_style}">
<header class="aw-ahead">
    <button type="button" class="aw-ibtn aw-burger" aria-label="Menu" onclick="AdminWorksJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    <a class="aw-abrand" href="Admin"><b>Studio</b> admin</a>
    <span class="aw-demo" id="aw-demo"></span>
    <a class="aw-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="aw-out" onclick="AdminWorksJs.signOut()">Sign out</button>
</header>
<aside class="aw-side" id="aw-nav" aria-label="Admin">
    <div class="aw-nav-top"><span>Admin</span><button type="button" class="aw-ibtn" aria-label="Close" onclick="AdminWorksJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="aw-amenu"><li><a class="aw-al" href="Admin">Dashboard<i class="aw-cnt" id="aw-cnt-Admin"></i></a></li><li><a class="aw-al" href="AdminLayout">Pages<i class="aw-cnt" id="aw-cnt-AdminLayout"></i></a></li><li><a class="aw-al" href="AdminPosts">Journal<i class="aw-cnt" id="aw-cnt-AdminPosts"></i></a></li><li><a class="aw-al aw-on" href="AdminWorks">Works<i class="aw-cnt" id="aw-cnt-AdminWorks"></i></a></li><li><a class="aw-al" href="AdminComments">Comments<i class="aw-cnt" id="aw-cnt-AdminComments"></i></a></li><li><a class="aw-al" href="AdminMessages">Messages<i class="aw-cnt" id="aw-cnt-AdminMessages"></i></a></li><li><a class="aw-al" href="AdminSettings">Settings<i class="aw-cnt" id="aw-cnt-AdminSettings"></i></a></li></ul>
</aside>
<div class="aw-scrim" id="aw-scrim" onclick="AdminWorksJs.closeNav()"></div>
<div class="aw-toast" id="aw-toast" role="status" aria-live="polite"></div>
<main class="aw-amain" id="aw-main"><p class="aw-loading">Loading&hellip;</p></main>
<div class="aw-modal" id="aw-modal" onclick="if(event.target===this)AdminWorksJs.closeModal()">
    <div class="aw-mbox" role="dialog" aria-modal="true"><button type="button" class="aw-ibtn aw-mclose" aria-label="Close" onclick="AdminWorksJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="aw-mbody"></div></div>
</div>
</div>
