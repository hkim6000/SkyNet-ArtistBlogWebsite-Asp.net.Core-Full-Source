<div class="hm-site" id="hm-site" data-page="Home" data-theme="{plhd_theme}" style="{plhd_style}">
<header class="hm-head">
    <div class="hm-head-row">
        <a class="hm-brand" href="Home" id="hm-brand">{plhd_brand}</a>
        <nav class="hm-nav" id="hm-nav" aria-label="Main">
            <div class="hm-nav-top"><span>Menu</span><button type="button" class="hm-ibtn" aria-label="Close" onclick="HomeJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="hm-menu"><li><a class="hm-ml" href="Works">Works</a></li><li><a class="hm-ml" href="Journal">Journal</a></li><li><a class="hm-ml" href="About">About</a></li><li><a class="hm-ml" href="Contact">Contact</a></li></ul>
        </nav>
        <button type="button" class="hm-ibtn hm-theme" aria-label="Light or dark" onclick="HomeJs.toggleTheme()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg></button>
        <button type="button" class="hm-ibtn hm-burger" aria-label="Menu" onclick="HomeJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    </div>
    <div class="hm-scrim" id="hm-scrim" onclick="HomeJs.closeNav()"></div>
</header>
<div class="hm-demo-bar" id="hm-demo-bar"></div>
<main class="hm-main" id="hm-main">{plhd_main}</main>
<footer class="hm-foot">
    <div class="hm-foot-in">
        <div><b class="hm-foot-name" id="hm-foot-name">{plhd_name}</b><p id="hm-foot-tag">{plhd_tagline}</p></div>
        <div class="hm-foot-r">
            <div class="hm-foot-links"><a href="Works">Works</a><a href="Journal">Journal</a><a href="About">About</a><a href="Contact">Contact</a><a href="AdminLogin">Admin</a></div>
            <div class="hm-foot-soc" id="hm-foot-soc">{plhd_social}</div>
        </div>
    </div>
    <div class="hm-foot-b">&copy; 2026 {plhd_name} &middot; A fictional demo built with the SkyNet Framework</div>
</footer>
<div class="hm-toast" id="hm-toast" role="status" aria-live="polite"></div>
