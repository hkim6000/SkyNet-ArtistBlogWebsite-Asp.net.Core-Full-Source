<div class="jr-site" id="jr-site" data-page="Journal" data-theme="{plhd_theme}" style="{plhd_style}">
<header class="jr-head">
    <div class="jr-head-row">
        <a class="jr-brand" href="Home" id="jr-brand">{plhd_brand}</a>
        <nav class="jr-nav" id="jr-nav" aria-label="Main">
            <div class="jr-nav-top"><span>Menu</span><button type="button" class="jr-ibtn" aria-label="Close" onclick="JournalJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="jr-menu"><li><a class="jr-ml" href="Works">Works</a></li><li><a class="jr-ml jr-on" href="Journal">Journal</a></li><li><a class="jr-ml" href="About">About</a></li><li><a class="jr-ml" href="Contact">Contact</a></li></ul>
        </nav>
        <button type="button" class="jr-ibtn jr-theme" aria-label="Light or dark" onclick="JournalJs.toggleTheme()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg></button>
        <button type="button" class="jr-ibtn jr-burger" aria-label="Menu" onclick="JournalJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    </div>
    <div class="jr-scrim" id="jr-scrim" onclick="JournalJs.closeNav()"></div>
</header>
<div class="jr-demo-bar" id="jr-demo-bar"></div>
<main class="jr-main" id="jr-main">{plhd_main}</main>
<footer class="jr-foot">
    <div class="jr-foot-in">
        <div><b class="jr-foot-name" id="jr-foot-name">{plhd_name}</b><p id="jr-foot-tag">{plhd_tagline}</p></div>
        <div class="jr-foot-r">
            <div class="jr-foot-links"><a href="Works">Works</a><a href="Journal">Journal</a><a href="About">About</a><a href="Contact">Contact</a><a href="AdminLogin">Admin</a></div>
            <div class="jr-foot-soc" id="jr-foot-soc">{plhd_social}</div>
        </div>
    </div>
    <div class="jr-foot-b">&copy; 2026 {plhd_name} &middot; A fictional demo built with the SkyNet Framework</div>
</footer>
<div class="jr-toast" id="jr-toast" role="status" aria-live="polite"></div>

</div>
