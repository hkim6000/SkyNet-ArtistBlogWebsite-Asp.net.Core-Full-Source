<div class="ct-site" id="ct-site" data-page="Contact" data-theme="{plhd_theme}" style="{plhd_style}">
<header class="ct-head">
    <div class="ct-head-row">
        <a class="ct-brand" href="Home" id="ct-brand">{plhd_brand}</a>
        <nav class="ct-nav" id="ct-nav" aria-label="Main">
            <div class="ct-nav-top"><span>Menu</span><button type="button" class="ct-ibtn" aria-label="Close" onclick="ContactJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="ct-menu"><li><a class="ct-ml" href="Works">Works</a></li><li><a class="ct-ml" href="Journal">Journal</a></li><li><a class="ct-ml" href="About">About</a></li><li><a class="ct-ml ct-on" href="Contact">Contact</a></li></ul>
        </nav>
        <button type="button" class="ct-ibtn ct-theme" aria-label="Light or dark" onclick="ContactJs.toggleTheme()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg></button>
        <button type="button" class="ct-ibtn ct-burger" aria-label="Menu" onclick="ContactJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    </div>
    <div class="ct-scrim" id="ct-scrim" onclick="ContactJs.closeNav()"></div>
</header>
<div class="ct-demo-bar" id="ct-demo-bar"></div>
<main class="ct-main" id="ct-main">{plhd_main}</main>
<footer class="ct-foot">
    <div class="ct-foot-in">
        <div><b class="ct-foot-name" id="ct-foot-name">{plhd_name}</b><p id="ct-foot-tag">{plhd_tagline}</p></div>
        <div class="ct-foot-r">
            <div class="ct-foot-links"><a href="Works">Works</a><a href="Journal">Journal</a><a href="About">About</a><a href="Contact">Contact</a><a href="AdminLogin">Admin</a></div>
            <div class="ct-foot-soc" id="ct-foot-soc">{plhd_social}</div>
        </div>
    </div>
    <div class="ct-foot-b">&copy; 2026 {plhd_name} &middot; A fictional demo built with the SkyNet Framework</div>
</footer>
<div class="ct-toast" id="ct-toast" role="status" aria-live="polite"></div>

</div>
