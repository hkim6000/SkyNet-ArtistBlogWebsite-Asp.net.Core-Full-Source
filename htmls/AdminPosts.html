<div class="ap-site ap-admin" id="ap-site" data-theme="light" style="{plhd_style}">
<header class="ap-ahead">
    <button type="button" class="ap-ibtn ap-burger" aria-label="Menu" onclick="AdminPostsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    <a class="ap-abrand" href="Admin"><b>Studio</b> admin</a>
    <span class="ap-demo" id="ap-demo"></span>
    <a class="ap-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ap-out" onclick="AdminPostsJs.signOut()">Sign out</button>
</header>
<aside class="ap-side" id="ap-nav" aria-label="Admin">
    <div class="ap-nav-top"><span>Admin</span><button type="button" class="ap-ibtn" aria-label="Close" onclick="AdminPostsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ap-amenu"><li><a class="ap-al" href="Admin">Dashboard<i class="ap-cnt" id="ap-cnt-Admin"></i></a></li><li><a class="ap-al" href="AdminLayout">Pages<i class="ap-cnt" id="ap-cnt-AdminLayout"></i></a></li><li><a class="ap-al ap-on" href="AdminPosts">Journal<i class="ap-cnt" id="ap-cnt-AdminPosts"></i></a></li><li><a class="ap-al" href="AdminWorks">Works<i class="ap-cnt" id="ap-cnt-AdminWorks"></i></a></li><li><a class="ap-al" href="AdminComments">Comments<i class="ap-cnt" id="ap-cnt-AdminComments"></i></a></li><li><a class="ap-al" href="AdminMessages">Messages<i class="ap-cnt" id="ap-cnt-AdminMessages"></i></a></li><li><a class="ap-al" href="AdminSettings">Settings<i class="ap-cnt" id="ap-cnt-AdminSettings"></i></a></li></ul>
</aside>
<div class="ap-scrim" id="ap-scrim" onclick="AdminPostsJs.closeNav()"></div>
<div class="ap-toast" id="ap-toast" role="status" aria-live="polite"></div>
<main class="ap-amain" id="ap-main"><p class="ap-loading">Loading&hellip;</p></main>
<div class="ap-modal" id="ap-modal" onclick="if(event.target===this)AdminPostsJs.closeModal()">
    <div class="ap-mbox" role="dialog" aria-modal="true"><button type="button" class="ap-ibtn ap-mclose" aria-label="Close" onclick="AdminPostsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ap-mbody"></div></div>
</div>
</div>
