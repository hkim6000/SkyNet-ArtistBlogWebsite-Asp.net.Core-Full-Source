<div class="ps-site" id="ps-site" data-page="Post" data-theme="{plhd_theme}" style="{plhd_style}">
<header class="ps-head">
    <div class="ps-head-row">
        <a class="ps-brand" href="Home" id="ps-brand">{plhd_brand}</a>
        <nav class="ps-nav" id="ps-nav" aria-label="Main">
            <div class="ps-nav-top"><span>Menu</span><button type="button" class="ps-ibtn" aria-label="Close" onclick="PostJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="ps-menu"><li><a class="ps-ml" href="Works">Works</a></li><li><a class="ps-ml" href="Journal">Journal</a></li><li><a class="ps-ml" href="About">About</a></li><li><a class="ps-ml" href="Contact">Contact</a></li></ul>
        </nav>
        <button type="button" class="ps-ibtn ps-theme" aria-label="Light or dark" onclick="PostJs.toggleTheme()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg></button>
        <button type="button" class="ps-ibtn ps-burger" aria-label="Menu" onclick="PostJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    </div>
    <div class="ps-scrim" id="ps-scrim" onclick="PostJs.closeNav()"></div>
</header>
<div class="ps-demo-bar" id="ps-demo-bar"></div>
<main class="ps-main" id="ps-main">{plhd_main}</main>
<footer class="ps-foot">
    <div class="ps-foot-in">
        <div><b class="ps-foot-name" id="ps-foot-name">{plhd_name}</b><p id="ps-foot-tag">{plhd_tagline}</p></div>
        <div class="ps-foot-r">
            <div class="ps-foot-links"><a href="Works">Works</a><a href="Journal">Journal</a><a href="About">About</a><a href="Contact">Contact</a><a href="AdminLogin">Admin</a></div>
            <div class="ps-foot-soc" id="ps-foot-soc">{plhd_social}</div>
        </div>
    </div>
    <div class="ps-foot-b">&copy; 2026 {plhd_name} &middot; A fictional demo built with the SkyNet Framework</div>
</footer>
<div class="ps-toast" id="ps-toast" role="status" aria-live="polite"></div>

</div>
